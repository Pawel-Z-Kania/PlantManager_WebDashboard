<div>
    <button (click)="fetchPotsData()"> Download API data </button>

    <div class="pot-list">
        @for (pot of potList(); track $index) {
        <div class="pot-card">
            {{pot.name}}
        </div>
        }
        @empty {
        <div>There are no pots</div>
        }
    </div>


</div>
