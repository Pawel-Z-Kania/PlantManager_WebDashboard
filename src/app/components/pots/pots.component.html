<div>
    <div class="pot-list">
        @for (pot of potsService.pots(); track $index) {

        <!-- START: POT CARD -->
        <div class="pot-card"
             [ngClass]="{'pot-card-selected': pot.id === potsService.selectedPot()?.id}"
             (click)="onSelect(pot.id)">
            <div class="pot-plant-type-icon"
                 role="img"
                 [attr.aria-label]="'Plant type: ' + pot.plant_type">
                <span aria-hidden="true">
                    ?
                </span>
            </div>
            <div class="pot-content">
                <div class="pot-title">
                    {{pot.name}}
                </div>
                <div class="pot-alerts">
                    @for (alert of pot.alerts; track $index) {
                    <div class="pot-alert-card">
                        {{alert.label}}
                    </div>
                    }
                </div>
            </div>
            <span class="material-symbols-outlined button-icon">
                table_chart_view
            </span>
        </div>
        <!-- END: POT CARD -->

        }
        @empty {
        <div>There are no pots</div>
        }
    </div>


</div>
